name: lint-and-tests

# Issue #103: run lint and the main test suite in CI. Same posture as
# production-migration — post-push verification for the solo workflow, not a
# required status check; local prevention stays in the untracked
# .git/hooks/pre-push hook (see CONTRIBUTING.md).
#
# - lint: `pnpm lint` (oxlint over packages/*/src). Exits nonzero on errors
#   only — the known warning backlog is triaged separately (issue #105).
# - test: the root `pnpm test` script — scripts' node:test suite plus every
#   workspace package's default vitest suite (perf/e2e suites are excluded by
#   the package scripts themselves).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck (all packages)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          # No built-in `cache: pnpm` — see the Corepack note in
          # production-migration.yml.

      - name: Enable Corepack (pin derived from packageManager)
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared and daemon (type dependencies)
        # @orcy/api / @orcy/mcp / @orcy/daemon resolve @orcy/shared via the
        # pnpm workspace symlink to the built dist/ directory, and @orcy/cli
        # resolves @orcy/daemon the same way — none of those dist/ trees
        # exist on a fresh checkout until built (the `...` builds shared
        # first, topologically).
        run: pnpm --filter "@orcy/daemon..." build

      - name: Typecheck every workspace package
        # Catches type errors at PR time instead of waiting for the
        # production-migration gate's api-only typecheck step.
        run: pnpm -r typecheck

  lint:
    name: Lint (oxlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          # No built-in `cache: pnpm` — see the Corepack note in
          # production-migration.yml; the pinned-pnpm contract outranks
          # caching for this gate.

      - name: Enable Corepack (pin derived from packageManager)
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  test:
    name: Main test suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          # No built-in `cache: pnpm` — see the Corepack note in
          # production-migration.yml.

      - name: Enable Corepack (pin derived from packageManager)
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared (type dependency)
        # @orcy/api / @orcy/mcp / @orcy/daemon resolve @orcy/shared via the
        # pnpm workspace symlink to the built dist/ directory. Without this
        # build step the dependent suites cannot resolve it on a fresh CI
        # checkout.
        run: pnpm --filter @orcy/shared build

      - name: Run main test suite
        # Root script: `test:scripts` (node --test over scripts/*.test.mjs)
        # followed by every workspace package's default vitest suite.
        run: pnpm test

      - name: Run the multi-process concurrency proof serially
        # Fork-worker proofs are load-sensitive under file parallelism (the
        # cold file DB boots the full migration chain); run it in its own
        # serial vitest pass, mirroring the local test:extraction-concurrency
        # script (the default suite excludes this file).
        run: pnpm --filter @orcy/api run test:extraction-concurrency
