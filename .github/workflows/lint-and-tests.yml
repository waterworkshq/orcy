name: lint-and-tests

# Issue #103: run lint and the main test suite in CI. Same posture as
# production-migration — post-push verification for the solo workflow, not a
# required status check; local prevention stays in the untracked
# .git/hooks/pre-push hook (see CONTRIBUTING.md).
#
# - lint: `pnpm lint` (oxlint over packages/*/src). Exits nonzero on errors
#   only — the known warning backlog is triaged separately (issue #105).
# - test: Node 24 runs the default API suite on two shards. A third runner
#   covers root scripts, the remaining workspace packages, and the serial
#   concurrency proof. Both supported Node majors exercise better-sqlite3.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck (all packages)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          # No built-in `cache: pnpm` — see the Corepack note in
          # production-migration.yml.

      - name: Enable Corepack (pin derived from packageManager)
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared and daemon (type dependencies)
        # @orcy/api / @orcy/mcp / @orcy/daemon resolve @orcy/shared via the
        # pnpm workspace symlink to the built dist/ directory, and @orcy/cli
        # resolves @orcy/daemon the same way — none of those dist/ trees
        # exist on a fresh checkout until built (the `...` builds shared
        # first, topologically).
        run: pnpm --filter "@orcy/daemon..." build

      - name: Typecheck every workspace package
        # Catches type errors at PR time instead of waiting for the
        # production-migration gate's api-only typecheck step.
        run: pnpm -r typecheck

  lint:
    name: Lint (oxlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          # No built-in `cache: pnpm` — see the Corepack note in
          # production-migration.yml; the pinned-pnpm contract outranks
          # caching for this gate.

      - name: Enable Corepack (pin derived from packageManager)
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  test:
    name: ${{ matrix.name }} (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API shard 1/2
            node-version: '24'
            shard: '1/2'
          - name: API shard 2/2
            node-version: '24'
            shard: '2/2'
          - name: Workspace tests
            node-version: '24'
            workspace: true
          - name: Native compatibility
            node-version: '26'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          # No built-in `cache: pnpm` — see the Corepack note in
          # production-migration.yml.

      - name: Install Corepack if missing
        # Node 25+ no longer bundles Corepack. The current setup-node
        # distribution provides it, but the matrix must not depend on that.
        run: command -v corepack >/dev/null 2>&1 || npm install -g corepack@0.34.2

      - name: Enable Corepack (pin derived from packageManager)
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild better-sqlite3 for the active Node ABI
        run: pnpm --filter @orcy/api rebuild better-sqlite3

      - name: Verify better-sqlite3 loads and executes
        run: |
          pnpm --filter @orcy/api exec node --input-type=module -e '
            import Database from "better-sqlite3";
            const db = new Database(":memory:");
            const { value } = db.prepare("SELECT 1 AS value").get();
            db.close();
            if (value !== 1) throw new Error("better-sqlite3 smoke query failed");
            console.log("better-sqlite3 loaded on Node " + process.version + " (ABI " + process.versions.modules + ")");
          '

      - name: Build API and workspace dependencies
        if: matrix.shard
        # Some API tests launch workers from dist/ on a fresh checkout.
        run: pnpm --filter '@orcy/api...' build

      - name: Run API shard
        if: matrix.shard
        run: pnpm --filter @orcy/api test --shard=${{ matrix.shard }} --maxWorkers=4

      - name: Build shared (type dependency)
        if: matrix.workspace
        run: pnpm --filter @orcy/shared build

      - name: Run root script tests
        if: matrix.workspace
        run: pnpm test:scripts

      - name: Run remaining workspace tests
        if: matrix.workspace
        # Exclude the root package too: its test script recursively runs the whole suite.
        run: pnpm -r --filter '!@orcy/api' --filter '!orcy' test

      - name: Run the multi-process concurrency proof serially
        if: matrix.workspace
        # Fork-worker proofs are load-sensitive under file parallelism (the
        # cold file DB boots the full migration chain); run it in its own
        # serial vitest pass, mirroring the local test:extraction-concurrency
        # script (the default suite excludes this file).
        run: pnpm --filter @orcy/api run test:extraction-concurrency
